<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17130f">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <title>Lirna system tracer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Georgia, "Times New Roman", serif;
        background: #17130f;
        color: #f3eadb;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 15% 10%, #332617 0, #17130f 48%); }
      main { width: min(44rem, calc(100% - 2rem)); margin: 0 auto; padding: clamp(3rem, 10vw, 8rem) 0; }
      .eyebrow { color: #d69a4a; font: 600 0.72rem/1.4 system-ui, sans-serif; letter-spacing: 0.2em; text-transform: uppercase; }
      h1 { max-width: 12ch; margin: 0.55rem 0 1rem; font-size: clamp(2.8rem, 10vw, 5.7rem); font-weight: 400; line-height: 0.92; letter-spacing: -0.05em; }
      .lede { max-width: 38rem; color: #c9bda9; font: 1rem/1.65 system-ui, sans-serif; }
      form { margin-top: 3rem; border-top: 1px solid #5d4932; padding-top: 1.5rem; }
      label { display: block; margin-bottom: 0.65rem; font: 600 0.8rem/1 system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
      textarea { width: 100%; min-height: 8rem; resize: vertical; border: 1px solid #6d563b; border-radius: 0; padding: 1rem; background: #211a13; color: inherit; font: 1rem/1.5 system-ui, sans-serif; }
      textarea:focus { outline: 2px solid #d69a4a; outline-offset: 2px; }
      .actions { display: flex; align-items: center; gap: 1rem; margin-top: 0.8rem; }
      button { border: 0; padding: 0.8rem 1.1rem; background: #dc9d4b; color: #17130f; font: 700 0.8rem/1 system-ui, sans-serif; cursor: pointer; }
      button:disabled { cursor: wait; opacity: 0.55; }
      .state { color: #aa9c89; font: 0.78rem/1.4 ui-monospace, monospace; }
      [data-result] { min-height: 1.5rem; margin-top: 1.25rem; font: 0.9rem/1.5 system-ui, sans-serif; }
      a { color: #f0b867; text-underline-offset: 0.2em; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Executable skeleton / synthetic data only</div>
      <h1>Trace the whole system.</h1>
      <p class="lede">Submit a non-sensitive fixture through Lirna's public control plane. PostgreSQL records it, the worker processes it, and replaceable adapters preserve the result.</p>
      <form>
        <label for="fixture">Synthetic fixture</label>
        <textarea id="fixture" required maxlength="1000">A synthetic, non-sensitive fixture</textarea>
        <div class="actions">
          <button type="submit">Run operation</button>
          <span class="state">Status: <strong data-status>idle</strong></span>
        </div>
        <div data-result aria-live="polite"></div>
      </form>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
