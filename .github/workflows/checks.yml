name: checks

on:
  pull_request:
  push:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lirna_test
          POSTGRES_PASSWORD: lirna
          POSTGRES_USER: lirna
        options: >-
          --health-cmd "pg_isready -U lirna"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgres://lirna:lirna@127.0.0.1:5432/lirna_test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command npm ci --ignore-scripts
      - run: nix develop --command npm run check:persistence
      - run: nix develop --command npm run typecheck
      - run: nix develop --command npm run build
      - run: nix develop --command npm test
      - run: nix develop --command npm run metrics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            coverage/
            metrics/
          if-no-files-found: ignore

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: cachix/install-nix-action@v31
      - if: github.event_name != 'schedule'
        run: nix develop --command scripts/secret-scan.sh range "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"
      - if: github.event_name == 'schedule'
        run: nix develop --command scripts/secret-scan.sh history
      - run: nix develop --command npm run test:secrets

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - id: blocking
        continue-on-error: true
        run: nix develop --command npm run check:semgrep
      - if: always()
        run: nix develop --command scripts/semgrep-scan.sh report
      - if: always()
        run: nix develop --command npm run test:security-scanning
      - if: always()
        run: test "${{ steps.blocking.outcome }}" = success

  trivy:
    name: Trivy npm vulnerability policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command npm ci --ignore-scripts
      - run: nix develop --command npm run check:trivy
      - run: nix develop --command npm run test:trivy-policy
