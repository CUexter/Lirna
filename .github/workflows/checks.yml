name: checks

on:
  pull_request:
  push:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lirna_test
          POSTGRES_PASSWORD: lirna
          POSTGRES_USER: lirna
        options: >-
          --health-cmd "pg_isready -U lirna"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgres://lirna:lirna@127.0.0.1:5432/lirna_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:persistence
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
