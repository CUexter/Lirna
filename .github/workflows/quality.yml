name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test maintenance policy
        run: bun run maintenance:test
      - name: Verify changed dependency lockfiles
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun scripts/verify-dependency-assessments.ts --range "$BASE_SHA" "${{ github.sha }}"
      - name: Score changed dependency confidence
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/score-dependencies.ts --range "$BASE_SHA" "${{ github.sha }}"

  static:
    name: Static checks
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Fallow
        run: npm install --global fallow@3.17.0
      - name: Test quality gate policy
        run: bun run quality:policy
      - name: Run static checks
        run: bun run quality:ci
      - name: Capture fallow metric
        if: ${{ always() }}
        run: bun run quality:fallow:metric
      - name: Upload fallow metric
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fallow-metric
          path: .fallow/metrics/*.json
          if-no-files-found: ignore
      - name: Fallow metric summary
        if: ${{ always() }}
        run: |
          {
            echo "## Fallow metric"
            echo
            node -e '
              const fs = require("node:fs");
              const dir = ".fallow/metrics";
              let files = [];
              try { files = fs.readdirSync(dir).filter((f) => f.endsWith(".json")); } catch {}
              if (files.length === 0) {
                console.log("_No fallow metric captured._");
              } else {
                const objs = files.map((f) => { try { return JSON.parse(fs.readFileSync(`${dir}/${f}`, "utf8")); } catch { return null; } }).filter(Boolean);
                console.log("| SHA | Health | Dead-code | Dupes |");
                console.log("| --- | --- | --- | --- |");
                for (const m of objs) {
                  const sha = (m.git_sha ?? "").slice(0, 8) || "?";
                  const score = m.health_score ?? "?";
                  const grade = m.health_grade ?? "?";
                  const dc = m.dead_code?.total ?? "?";
                  const dg = m.dupes?.clone_groups ?? "?";
                  const dp = m.dupes?.duplication_percentage ?? "?";
                  console.log(`| ${sha} | ${score} (${grade}) | ${dc} | ${dg} (${dp}%) |`);
                }
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

  types:
    name: Type checks
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check workspace types
        run: bun run check-types

  build:
    name: Production builds
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build workspaces
        run: bun run build

  e2e:
    name: Browser E2E and accessibility
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Firefox runtime
        run: bunx playwright install --with-deps firefox
      - name: Run browser E2E suite
        run: bun run test:e2e:ci
      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  database:
    name: PostgreSQL migrations and repository
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify migrations and repository behavior
        run: bun run test:db

  sep-production:
    name: Production SEP journey
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Firefox runtime
        run: bunx playwright install --with-deps firefox
      - name: Run production SEP gate
        run: bun run test:sep:production

  quality:
    name: quality
    if: ${{ always() }}
    needs: [install, static, types, build, e2e, database, sep-production]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job to pass
        run: |
          test "${{ needs.install.result }}" = success
          test "${{ needs.static.result }}" = success
          test "${{ needs.types.result }}" = success
          test "${{ needs.build.result }}" = success
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.database.result }}" = success
          test "${{ needs.sep-production.result }}" = success
