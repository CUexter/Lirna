<!doctype html>
<!-- PROTOTYPE ONLY: Three concept Visualization variants, switchable via ?variant=A|B|C. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lirna concept Visualization prototype</title>
  <style>
    :root{color-scheme:light;--ink:#17201e;--muted:#68716e;--paper:#eeeade;--panel:#fffdf7;--line:#d6d0c2;--green:#1b6551;--green-soft:#e0f0e8;--blue:#355f8b;--blue-soft:#e3edf7;--amber:#9a611a;--amber-soft:#f7e9ce;--coral:#a34f42;--coral-soft:#f5dfda;--shadow:0 18px 55px rgba(22,31,28,.16);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #8cbdae;outline-offset:2px}h1,h2,h3,p{margin-top:0}h1,h2{font-family:Georgia,serif;font-weight:600}h1{font-size:clamp(28px,4vw,48px);line-height:1.05}h2{font-size:23px}p{line-height:1.55}.muted{color:var(--muted)}.eyebrow{color:var(--muted);font-size:10px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}
    .prototype-flag{position:fixed;z-index:70;top:9px;left:9px;border:1px solid #dfb867;border-radius:999px;background:#fff1c4;color:#654500;padding:6px 9px;font:750 10px/1 ui-monospace,monospace;letter-spacing:.08em}.topbar{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);background:rgba(255,253,247,.95);padding:10px 22px 10px 160px}.brand{font:700 20px/1 Georgia,serif}.depth-tabs,.row{display:flex;align-items:center;gap:7px}.depth-tabs{flex-wrap:wrap}.depth-tabs button,.button{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:8px 11px}.depth-tabs button.active{border-color:var(--ink);background:var(--ink);color:white}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;background:#e7e3d9;font-size:11px}.pill.green{background:var(--green-soft);color:#154f40}.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px}.shell{min-height:calc(100vh - 64px);padding-bottom:90px}
    .context-drawer{border-left:1px solid var(--line);background:#f8f5ec;padding:25px 17px}.context-drawer .card{margin-bottom:12px}.support-row{display:flex;justify-content:space-between;gap:9px;border-top:1px solid var(--line);padding:10px 0;font-size:12px}.support-row:first-of-type{border-top:0}.support-row strong{color:var(--green)}.action-card .row{flex-wrap:wrap}.result-text{margin:12px 0 0;border-left:3px solid var(--amber);padding-left:10px;color:var(--muted);font-size:12px}
    .state-dump{position:fixed;z-index:40;right:12px;bottom:82px;width:min(390px,calc(100vw - 24px));max-height:38vh;overflow:auto;border-radius:10px;background:#101816;color:#d4e9e3;padding:10px 12px;box-shadow:var(--shadow);font:11px/1.5 ui-monospace,monospace}.state-dump summary{cursor:pointer;font-weight:800}.state-dump pre{margin-bottom:0;white-space:pre-wrap}.switcher{position:fixed;z-index:60;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:5px;border:1px solid #41504c;border-radius:999px;background:#111a18;color:white;padding:6px;box-shadow:var(--shadow)}.switcher button{width:35px;height:35px;border:0;border-radius:50%;background:#2c3936;color:white}.switcher span{min-width:235px;text-align:center;font-size:12px;font-weight:750}
    .a-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px}.a-main{padding:36px clamp(18px,5vw,60px)}.heading{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.diagram{position:relative;min-height:520px;border:1px solid #c9c2b3;border-radius:20px;background-color:#f7f3e8;background-image:radial-gradient(#cbc5b8 1px,transparent 1px);background-size:22px 22px;overflow:hidden}.organism{position:absolute;z-index:2;width:145px;min-height:90px;display:grid;place-items:center;border:1px solid #7f948d;border-radius:45% 55% 48% 52%;background:white;padding:13px;text-align:center;box-shadow:0 8px 22px rgba(25,35,31,.1)}.organism.focus{border:2px solid var(--green);background:#eff8f3}.organism.pressure{border-color:#c58b3b;background:#fff5df}.organism.outcome{border-color:#698db2;background:#eef5fb}.arrow{position:absolute;z-index:1;height:3px;transform-origin:left center;background:var(--green)}.arrow::after{content:"";position:absolute;right:-1px;top:-5px;border-left:10px solid var(--green);border-top:6px solid transparent;border-bottom:6px solid transparent}.arrow-label{position:absolute;z-index:3;border-radius:999px;background:#fffdf7;padding:4px 8px;color:var(--muted);font-size:10px}.question-pin{position:absolute;z-index:3;border:1px dashed var(--coral);border-radius:10px;background:var(--coral-soft);padding:10px;font-size:12px}
    .b-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;background:#111917;color:#f5f3ec}.b-main{min-width:0;padding:32px clamp(14px,4vw,50px)}.b-main .muted,.b-main .eyebrow{color:#9baba6}.player{position:relative;aspect-ratio:16/9;display:grid;place-items:center;border:1px solid #42534e;border-radius:14px;background:radial-gradient(circle at 50% 42%,#243b34,#101715 70%);overflow:hidden}.population{display:flex;gap:10px;align-items:end}.creature{width:45px;height:45px;border-radius:50% 50% 42% 42%;background:#dfb864;box-shadow:inset -8px -8px rgba(0,0,0,.12)}.creature:nth-child(2n){height:62px;background:#74ad9a}.creature:nth-child(3n){width:54px;background:#df876f}.stage-caption{position:absolute;left:20px;bottom:18px;right:20px;text-align:center;color:#dce7e3;font-family:Georgia,serif;font-size:clamp(16px,2vw,23px)}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.scene{border:1px solid #42534e;border-radius:9px;background:#1b2824;color:#b9c6c2;padding:10px;text-align:left;font-size:11px}.scene.active{border-color:#8fc2b2;background:#29433a;color:white}.transport{display:flex;justify-content:center;gap:8px;margin:12px}.transport button{border:1px solid #4c615b;border-radius:50%;background:#23342f;color:white;width:38px;height:38px}.b-layout .context-drawer{color:var(--ink)}
    .c-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px}.c-main{padding:31px clamp(14px,4vw,48px);background:#e8dfcf}.real-excalidraw{width:100%;height:590px;border:1px solid #bbb3a4;border-radius:8px;background:white}.embed-note{margin-top:9px;color:var(--muted);font-size:11px}
    @media(max-width:850px){.prototype-flag{top:6px;left:6px}.topbar{align-items:flex-end;flex-direction:column;padding:42px 10px 10px}.topbar .brand{align-self:flex-start}.depth-tabs{width:100%}.depth-tabs button{flex:1;padding:8px 4px;font-size:11px}.a-layout,.b-layout,.c-layout{display:block}.heading{display:block}.a-main,.b-main,.c-main{padding:24px 12px 105px}.context-drawer{border:0;border-top:1px solid var(--line)}.diagram,.canvas-board{min-height:580px}.organism{width:115px;font-size:11px}.canvas-card{width:140px;font-size:11px}.timeline{grid-template-columns:1fr 1fr}.state-dump{display:none}.switcher{left:8px;right:8px;transform:none;justify-content:center}.switcher span{min-width:150px}}
  </style>
</head>
<body>
  <div class="prototype-flag">THROWAWAY PROTOTYPE</div>
  <header class="topbar"><div class="brand">Lirna / Visualize one concept</div><nav class="depth-tabs" aria-label="Conceptual depth"><button data-depth="overview">Overview</button><button data-depth="mechanism">Mechanism</button><button data-depth="evidence">Evidence</button></nav></header>
  <main id="app"></main><details class="state-dump"><summary>Prototype state</summary><pre id="state"></pre></details><div class="switcher" aria-label="Prototype variant switcher"><button id="previous" aria-label="Previous variant">&larr;</button><span id="variant-label"></span><button id="next" aria-label="Next variant">&rarr;</button></div>
  <script>
    const variants={A:{name:"Interactive diagram",render:renderA},B:{name:"Animated explanation",render:renderB},C:{name:"Concept canvas",render:renderC}};
    const depthCopy={overview:"See the idea as one bounded visual whole.",mechanism:"Follow the relationships that make the idea work.",evidence:"Open the claims, examples, and exact evidence behind an element."};
    const state={variant:param("variant","A"),depth:param("depth","overview"),scene:1,selectedElement:"variation",pendingAction:null,actionResult:null};if(!variants[state.variant])state.variant="A";if(!depthCopy[state.depth])state.depth="overview";
    function param(key,fallback){return new URLSearchParams(location.search).get(key)||fallback}function setParam(key,value){const url=new URL(location.href);url.searchParams.set(key,value);history.replaceState({},"",url)}function setDepth(depth){state.depth=depth;state.actionResult=null;setParam("depth",depth);render()}function setVariant(key){state.variant=key;state.actionResult=null;setParam("variant",key);render()}function cycle(offset){const keys=Object.keys(variants),index=keys.indexOf(state.variant);setVariant(keys[(index+offset+keys.length)%keys.length])}function selectElement(element){state.selectedElement=element;render()}function setScene(scene){state.scene=scene;render()}
    function tryAction(kind){const outcomes={semantic:"Would change the concept claim represented by an arrow or juxtaposition.",composition:"Would change only layout, scene order, timing, or visual grouping.",evidence:"Would change which Citation, Annotation, or Source passage supports this visual element.",object:"Would add or remove navigation to a supporting Owned note or other Lirna object."};state.pendingAction=kind;state.actionResult=outcomes[kind];render()}
    function actionCard(){return `<div class="card action-card"><div class="eyebrow">Try editing this relationship</div><p><strong>Variation</strong> enables <strong>differential survival and reproduction</strong>.</p><div class="row"><button class="button" onclick="tryAction('semantic')">Concept meaning</button><button class="button" onclick="tryAction('composition')">Visual composition</button><button class="button" onclick="tryAction('evidence')">Evidence attachment</button><button class="button" onclick="tryAction('object')">Object link</button></div>${state.actionResult?`<p class="result-text"><strong>Simulated boundary:</strong> ${state.actionResult}</p>`:""}</div>`}
    function contextDrawer(){return `<aside class="context-drawer"><div class="eyebrow">Selected element</div><h2>${state.selectedElement}</h2><p class="muted">${depthCopy[state.depth]}</p><div class="card"><div class="eyebrow">Supporting Lirna objects</div><div class="support-row"><span>Owned note</span><strong>Open claim</strong></div><div class="support-row"><span>Source state</span><strong>Inspect passage</strong></div><div class="support-row"><span>Annotation</span><strong>Open question</strong></div><div class="support-row"><span>Research thread</span><strong>Resume inquiry</strong></div></div>${actionCard()}</aside>`}
    function renderA(){return `<section class="shell a-layout"><div class="a-main"><div class="heading"><div><div class="eyebrow">Generated explanatory diagram</div><h1>How natural selection changes a population</h1><p class="muted">A bounded concept diagram, not a map of notes.</p></div><span class="pill green">${state.depth}</span></div><div class="diagram"><button class="organism focus" style="left:8%;top:36%" onclick="selectElement('variation')"><strong>Variation</strong><small>Individuals differ</small></button><div class="arrow" style="left:28%;top:46%;width:17%"></div><span class="arrow-label" style="left:32%;top:40%">meets</span><button class="organism pressure" style="left:45%;top:36%" onclick="selectElement('selection pressure')"><strong>Selection pressure</strong><small>Conditions matter</small></button><div class="arrow" style="left:65%;top:46%;width:13%"></div><span class="arrow-label" style="left:67%;top:40%">shapes</span><button class="organism outcome" style="left:78%;top:36%" onclick="selectElement('population change')"><strong>Population change</strong><small>Across generations</small></button><div class="question-pin" style="left:39%;top:68%">Where does chance enter?</div></div></div>${contextDrawer()}</section>`}
    function renderB(){const scenes=["Variation appears","Conditions select","Traits reproduce differently","The population shifts"];return `<section class="shell b-layout"><div class="b-main"><div class="heading"><div><div class="eyebrow">Generated Manim-style explanation</div><h1>Watch the mechanism unfold</h1><p class="muted">Pause, inspect an element, or branch into its evidence.</p></div><span class="pill green">${state.depth}</span></div><div class="player" onclick="selectElement('${scenes[state.scene-1]}')"><div class="population">${Array.from({length:7},()=>"<span class='creature'></span>").join("")}</div><div class="stage-caption">${state.scene}. ${scenes[state.scene-1]}</div></div><div class="transport"><button onclick="setScene(Math.max(1,state.scene-1))">&larr;</button><button onclick="setScene(Math.min(4,state.scene+1))">&rarr;</button></div><div class="timeline">${scenes.map((scene,i)=>`<button class="scene ${state.scene===i+1?"active":""}" onclick="setScene(${i+1})"><strong>${i+1}</strong><br>${scene}</button>`).join("")}</div></div>${contextDrawer()}</section>`}
    function renderC(){return `<section class="shell c-layout"><div class="c-main"><div class="heading"><div><div class="eyebrow">Embedded Excalidraw concept canvas</div><h1>Edit an AI-generated native scene</h1><p class="muted">These are real Excalidraw elements, bindings, labels, and editor controls.</p></div><span class="pill green">${state.depth}</span></div><iframe class="real-excalidraw" src="embed/excalidraw.html" title="Embedded Excalidraw editor"></iframe><p class="embed-note">Disposable integration pins Excalidraw 0.18.1 and serves a static local build. Production would keep the generation adapter isolated from the beta Skeleton API.</p></div>${contextDrawer()}</section>`}
    function render(){document.getElementById("app").innerHTML=variants[state.variant].render();document.getElementById("variant-label").textContent=`${state.variant} — ${variants[state.variant].name}`;document.querySelectorAll("[data-depth]").forEach(button=>button.classList.toggle("active",button.dataset.depth===state.depth));document.getElementById("state").textContent=JSON.stringify(state,null,2)}
    document.querySelectorAll("[data-depth]").forEach(button=>button.addEventListener("click",()=>setDepth(button.dataset.depth)));document.getElementById("previous").addEventListener("click",()=>cycle(-1));document.getElementById("next").addEventListener("click",()=>cycle(1));addEventListener("keydown",event=>{if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(event.key==="ArrowLeft")cycle(-1);if(event.key==="ArrowRight")cycle(1)});render();
  </script>
</body>
</html>
